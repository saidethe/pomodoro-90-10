<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1118">
<title>Study Session — 90 / 10 · 5s Start</title>
<style>
:root{--ink:#f4f7f8;--muted:#a6b2bc;--line:rgba(225,236,242,.15);--panel:rgba(10,16,23,.92);--focus:#9fe0bf;--break:#f0c27b;--accent:var(--focus)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{color:var(--ink)}
.overlay{position:absolute;top:clamp(8px,2vh,20px);left:clamp(8px,2vw,20px);width:min(350px,calc(100vw - 16px));padding:13px 14px 11px;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 7px 24px rgba(0,0,0,.2)}
.top,.main,.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{margin-bottom:11px}.brand{display:flex;align-items:center;gap:7px;color:#dce5e9;font-size:9px;font-weight:800;letter-spacing:.16em}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.mode{padding:5px 8px;border-radius:99px;border:1px solid rgba(159,224,191,.34);background:rgba(159,224,191,.09);color:var(--accent);font-size:8px;font-weight:800;letter-spacing:.12em}
.main{align-items:flex-end}.time-label{margin-bottom:3px;color:var(--muted);font-size:8px;letter-spacing:.15em;font-weight:700}.time{font-size:clamp(42px,11vw,54px);line-height:.98;font-weight:650;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.side{min-width:78px;text-align:right;padding-bottom:3px}.count{font-size:21px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}.count small{font-size:10px;color:var(--muted)}.count-label{margin-top:5px;color:var(--muted);font-size:8px;letter-spacing:.14em;font-weight:700}.next{margin-top:8px;color:var(--muted);font-size:8px;white-space:nowrap}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:13px 0 8px}.segment{height:4px;border-radius:99px;background:rgba(232,240,244,.16)}.segment.done{background:var(--focus)}.segment.current{background:var(--accent)}
.bottom{color:var(--muted);font-size:7px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.bottom span:last-child{text-align:right}.status{margin-top:9px;color:#8796a1;font-size:7px;line-height:1.35;letter-spacing:.08em}.break{--accent:var(--break)}.break .mode{border-color:rgba(240,194,123,.36);background:rgba(240,194,123,.10)}.ready{--accent:#a9c6f5}.ready .mode{border-color:rgba(169,198,245,.36);background:rgba(169,198,245,.10)}.ready .time{color:#d3e1f5}.done{--accent:#a9c6f5}.done .mode{border-color:rgba(169,198,245,.36);background:rgba(169,198,245,.10)}.done .time{color:#a9c6f5}
@media(max-width:320px){.overlay{padding:11px}.side{min-width:68px}}
</style>
</head>
<body>
<main class="overlay" id="overlay" aria-live="off">
  <div class="top">
    <div class="brand"><span class="dot"></span> STUDY SESSION</div>
    <div class="mode" id="mode">GET READY</div>
  </div>
  <div class="main">
    <div>
      <div class="time-label" id="timeLabel">STARTING IN</div>
      <div class="time" id="time">00:05</div>
    </div>
    <div class="side">
      <div class="count"><span id="session">01</span><small> / 10</small></div>
      <div class="count-label">SESSION</div>
      <div class="next" id="next">Focus begins in 5 sec</div>
    </div>
  </div>
  <div class="track" id="track" aria-label="Ten focus sessions progress">
    <span class="segment current"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span>
  </div>
  <div class="bottom"><span id="completed">0 / 10 completed</span><span>90 MIN FOCUS · 10 MIN BREAK</span></div>
  <div class="status" id="status">GET READY · TIMER STARTS AUTOMATICALLY IN 5 SECONDS</div>
</main>
<script>
(() => {
  'use strict';
  const READY_MS = 5 * 1000;
  const FOCUS_MS = 90 * 60 * 1000;
  const BREAK_MS = 10 * 60 * 1000;
  const TOTAL = 10;
  const $ = id => document.getElementById(id);
  const overlay = $('overlay');
  let phase = 'ready';
  let session = 1;
  // The five-second ready countdown begins as soon as this webpage loads.
  let deadline = Date.now() + READY_MS;
  let audio = null;
  let lastCue = '';

  function format(ms) {
    const sec = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }

  function setupAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    try {
      if (!audio) audio = new Ctx();
      // Browsers may keep this suspended until a user gesture. We try, but cannot force-unlock it.
      if (audio.state === 'suspended') audio.resume().catch(() => {});
      return true;
    } catch (_) { return false; }
  }

  function cue(kind) {
    if (!setupAudio() || !audio || audio.state !== 'running') {
      $('status').textContent = 'TIMER RUNNING · WEBPAGE AUDIO MAY BE BLOCKED BY PRISM';
      return;
    }
    const notes = kind === 'break' ? [660, 830, 1046] : kind === 'focus' ? [880, 660] : [523, 659, 784, 988];
    const now = audio.currentTime + 0.04;
    notes.forEach((freq, i) => {
      const start = now + i * 0.2;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.045, start + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start(start); osc.stop(start + 0.27);
    });
  }

  function render(now) {
    const remaining = Math.max(0, deadline - now);
    $('time').textContent = phase === 'done' ? 'DONE' : format(remaining);
    $('session').textContent = String(Math.min(session, TOTAL)).padStart(2, '0');
    overlay.classList.toggle('ready', phase === 'ready');
    overlay.classList.toggle('break', phase === 'break');
    overlay.classList.toggle('done', phase === 'done');
    if (phase === 'ready') {
      $('mode').textContent = 'GET READY'; $('timeLabel').textContent = 'STARTING IN'; $('next').textContent = 'Focus begins in ' + Math.max(0, Math.ceil(remaining / 1000)) + ' sec';
    } else if (phase === 'focus') {
      $('mode').textContent = 'FOCUS MODE'; $('timeLabel').textContent = 'TIME TO FOCUS'; $('next').textContent = 'Next: 10 min break';
    } else if (phase === 'break') {
      $('mode').textContent = 'BREAK MODE'; $('timeLabel').textContent = 'TIME TO RESET'; $('next').textContent = 'Next: 90 min focus';
    } else {
      $('mode').textContent = 'GOAL COMPLETE'; $('timeLabel').textContent = 'ALL SESSIONS DONE'; $('next').textContent = '10 focus sessions finished';
    }
    const completed = phase === 'done' ? TOTAL : (phase === 'break' ? session : (phase === 'ready' ? 0 : session - 1));
    $('completed').textContent = completed + ' / ' + TOTAL + ' completed';
    [...$('track').children].forEach((seg, i) => {
      seg.className = 'segment';
      if (i < completed) seg.classList.add('done');
      else if (phase !== 'done' && i === session - 1) seg.classList.add('current');
    });
  }

  function transition(now) {
    if (phase === 'ready') {
      phase = 'focus';
      deadline = now + FOCUS_MS;
      lastCue = 'start';
      cue('focus');
      $('status').textContent = 'FOCUS SESSION 1 OF 10 · TIMER RUNNING';
    } else if (phase === 'focus') {
      if (session >= TOTAL) {
        phase = 'done'; deadline = now; lastCue = 'done'; cue('done');
        $('status').textContent = '10 FOCUS SESSIONS COMPLETE';
      } else {
        phase = 'break'; deadline = now + BREAK_MS; lastCue = 'break'; cue('break');
        $('status').textContent = 'BREAK STARTED · NEXT FOCUS BEGINS AUTOMATICALLY';
      }
    } else if (phase === 'break') {
      phase = 'focus'; session += 1; deadline = now + FOCUS_MS; lastCue = 'focus'; cue('focus');
      $('status').textContent = 'FOCUS SESSION ' + session + ' OF 10';
    }
  }

  function tick() {
    const now = Date.now();
    let guard = 0;
    while (phase !== 'done' && now >= deadline && guard < 30) {
      transition(deadline);
      guard++;
    }
    render(now);
  }

  // Begin a visible five-second ready countdown as soon as PRISM loads this webpage.
  // Focus starts automatically when the countdown reaches zero.
  setupAudio();
  $('status').textContent = 'GET READY · FOCUS STARTS AUTOMATICALLY IN 5 SECONDS';
  if (audio) audio.addEventListener('statechange', () => {
    if (phase !== 'done' && phase !== 'ready') $('status').textContent = audio.state === 'running'
      ? 'TIMER RUNNING · AUDIO READY'
      : 'TIMER RUNNING · PRISM MAY BLOCK WEBPAGE AUDIO';
  });
  render(Date.now());
  window.setInterval(tick, 250);
  document.addEventListener('visibilitychange', tick);
})();
</script>
</body>
</html>
